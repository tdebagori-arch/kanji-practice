<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{

button{font-family:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent;}

.gq{font-size:13px;font-weight:700;color:var(--tx);}
.gc.ms .gn{background:var(--wnb);color:var(--wn);}

.qc{font-size:14px;font-weight:700;color:var(--mu);white-space:nowrap;}

.qcard{background:var(--card);border-radius:18px;padding:20px 18px 16px;box-shadow:var(--sh);margin-bottom:16px;}

.qs{font-size:20px;line-height:2.1;color:var(--tx);}
.qk{font-weight:800;color:var(--p);border-bottom:2.5px solid var(--p);}
.qhint{font-size:12px;color:var(--mu);margin-top:8px;}

.rmain.ng{color:var(--ng);}
.rmain.sk{color:var(--wn);}

.ab.ng{border-color:var(--ng);background:var(--ngb);}

.amk.ng{color:var(--ng);}

.semoji{font-size:56px;margin-bottom:8px;}
.snum{font-size:58px;font-weight:800;color:var(--p);line-height:1;}
.sden{font-size:18px;font-weight:400;color:var(--mu);}

.smsg{font-size:16px;font-weight:700;color:var(--tx);margin-top:4px;}
.mhd{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--mu);text-transform:uppercase;margin:22px 0 8px;text-align:left;}

.ma{font-size:13px;font-weight:700;color:var(--p);white-space:nowrap;}
.sacts{display:flex;flex-direction:column;gap:10px;margin-top:22px;}

.bpl{background:var(--pl);color:var(--p);font-size:14px;font-weight:700;border-radius:12px;padding:13px;border:none;}

</style>

// ── State ──────────────────────────────────────────
const S={
  screen:'home',
  qs:[],label:'',idx:0,score:0,missed:[],allMissed:[],
  rev:false,isRetry:false,lastRes:null,
  selChars:[],candData:[],strokes:[],timers:[],gen:0,drawing:[],lpos:[]
};

function e(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function pool(t){
  const Q=t==='kaki'?kakiQ:yomiQ;
  return Object.values(Q).flatMap((qs,i)=>qs.map(q=>({...q,sec:t,set:i+1})));
}
function grps(t){const p=pool(t),g=[];for(let i=0;i<p.length;i+=25)g.push(p.slice(i,i+25));return g;}

// ── Master render ───────────────────────────────────
function render(){
  S.gen++;
  S.timers.forEach(t=>clearTimeout(t));
  S.timers=[];
  const app=document.getElementById('app');
  if(S.screen==='home') app.innerHTML=homeHTML();
  else if(S.screen==='quiz'){app.innerHTML=quizHTML();if(!S.rev)setupCV();}
  else app.innerHTML=scoreHTML();
  window.scrollTo(0,0);
}

// ── Home HTML ───────────────────────────────────────
function homeHTML(){
  const kg=grps('kaki'),yg=grps('yomi');
  const mk=S.allMissed.filter(q=>q.sec==='kaki'),my=S.allMissed.filter(q=>q.sec==='yomi');
  const gc=(qs,i,t)=>`<button class="gc" onclick="stG(${i},'${t}')"><div class="gn">${i+1}</div><div class="gr">${i*25+1}〜${i*25+qs.length}</div><div class="gq">${qs.length}問</div></button>`;
  return `<div class="hd"><div class="logo">漢</div><div><div class="h1">漢字練習</div><div class="hsub">書き取り・読み取りトレーニング</div></div></div>
  <div class="slabel">書き取り</div><div class="gg">${kg.map((q,i)=>gc(q,i,'kaki')).join('')}</div>
  <div class="slabel">読み取り</div><div class="gg">${yg.map((q,i)=>gc(q,i,'yomi')).join('')}</div>
  ${(mk.length||my.length)?`<div class="slabel">間違えた問題</div><div class="gg">
    ${mk.length?`<button class="gc ms" onclick="stR('kaki')"><div class="gn">書</div><div class="gr">書き取り</div><div class="gq">${mk.length}問</div></button>`:''}
    ${my.length?`<button class="gc ms" onclick="stR('yomi')"><div class="gn">読</div><div class="gr">読み取り</div><div class="gq">${my.length}問</div></button>`:''}
  </div>`:''}`;
}

// ── Quiz HTML ───────────────────────────────────────
function quizHTML(){
  const q=S.qs[S.idx];
  if(!q) return `<p style="padding:40px;text-align:center">エラーが発生しました。<br><br><button class="bpri" style="margin-top:12px" onclick="goHome()">ホームに戻る</button></p>`;
  const tot=S.qs.length,pct=(S.idx/tot*100).toFixed(1);
  const bar=`<div class="qb">
    <button class="bk" onclick="goHome()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>ホーム</button>
    <div class="qt">${e(S.label)}</div>
    <div class="qc">${S.idx+1}/${tot}</div>
  </div>
  <div class="pb"><div class="pf" style="width:${pct}%"></div></div>`;

  if(!S.rev){
    const pts=q.s.split('__');
    const n=q.ans.length;
    const w=Math.min((typeof window!=='undefined'?window.innerWidth:390),620);
    const cvS=Math.min(190,Math.floor((w-32-(n-1)*12)/n));
    return `${bar}
    <div class="qcard">
      <div class="qtype">${e(q.sec==='kaki'?'書き取り':'読み取り')}</div>
      <div class="qs">${e(pts[0]||'')}<span class="qk">${e(q.kana)}</span>${e(pts[1]||'')}</div>
      <div class="qhint">${q.sec==='kaki'?'カタカナを漢字に直してください':'漢字の読みをひらがなで書いてください'}</div>
    </div>
    <div class="cvrow">${[...Array(n)].map((_,i)=>`<div class="cbox"><div class="clbl">${i+1}文字目</div><canvas id="cv${i}" width="${cvS}" height="${cvS}"></canvas><div class="cds" id="cds${i}"></div><button class="clr" onclick="clrCV(${i})">消す</button></div>`).join('')}</div>
    <div class="acts">
      <button class="bmain" onclick="doCheck()">答え合わせ</button>
      <button class="bsub" onclick="doSkip()">わからない</button>
    </div>`;
  }

  // Answer view
  const n=q.ans.length;
  const bsz=n<=2?120:n<=4?100:84,bfs=n<=2?50:n<=4?40:32;
  const r=S.lastRes;
  let bc='',icon='',main='',sub='';
  if(r.skip){bc='sk';icon='💡';main='答え';sub=`${q.ans}（${q.read}）`;}
  else if(r.auto){
    if(r.ok){bc='ok';icon='✅';main='正解！';sub=`${q.ans}（${q.read}）`;}
    else{bc='ng';icon='❌';main='不正解';sub=`正解：${q.ans}（${q.read}）`;}
  }else{bc='ok';icon='✅';main='正解';sub=`${q.ans}（${q.read}）`;}

  const boxes=[...Array(n)].map((_,i)=>{
    let cls='',mk='';
    if(r.auto&&q.sec==='kaki'){const ok=S.selChars[i]===q.ans[i];cls=ok?'ok':'ng';mk=`<span class="amk ${cls}">${ok?'○':'✗'}</span>`;}
    return `<div class="ab ${cls}" style="width:${bsz}px;height:${bsz}px;font-size:${bfs}px;"><span class="albl">${i+1}文字目</span>${e(q.ans[i])}${mk}</div>`;
  }).join('');

  return `${bar}
  <div class="rbanner ${bc}"><span class="ricon">${icon}</span><div><div class="rmain ${bc}">${e(main)}</div><div class="rsub">${e(sub)}</div></div></div>
  <div class="arow">${boxes}</div>
  <div style="text-align:center"><span class="rpill">読み：${e(q.read)}</span></div>
  <button class="bnext" onclick="doNext()">${S.idx+1<tot?'次の問題 →':'結果を見る'}</button>`;
}

// ── Score HTML ──────────────────────────────────────
function scoreHTML(){
  const tot=S.qs.length,pct=Math.round(S.score/tot*100);
  const em=pct>=90?'🏆':pct>=70?'⭐':pct>=50?'📚':'💪';
  const msg=pct>=90?'素晴らしい！':pct>=70?'よくできました！':pct>=50?'惜しい！':' 引き続き練習しよう！';
  return `<div class="sc">
    <div class="semoji">${em}</div>
    <div class="snum">${S.score}<span class="sden"> / ${tot}</span></div>
    <div class="spill">正解率 ${pct}%</div>
    <div class="smsg">${msg}</div>
    ${S.missed.length>0?`<div class="mhd">間違えた問題（${S.missed.length}問）</div>${S.missed.map(q=>`<div class="mi"><span class="mk">${e(q.kana)}</span><span class="ma">${e(q.ans)}（${e(q.read)}）</span></div>`).join('')}`:''}
    <div class="sacts">
      ${S.missed.length>0?`<button class="bwarn" onclick="doRetryMissed()">間違えた ${S.missed.length}問を再練習する</button>`:''}
      <button class="bpl" onclick="stG_again()">もう一度</button>
      <button class="bpri" onclick="goHome()">ホームに戻る</button>
    </div>
  </div>`;
}

// ── Canvas setup ────────────────────────────────────
function setupCV(){
  const q=S.qs[S.idx],n=q.ans.length;
  S.strokes=Array.from({length:n},()=>[]);
  S.selChars=Array(n).fill(null);
  S.candData=Array.from({length:n},()=>[]);
  S.timers=Array(n).fill(null);
  S.drawing=Array(n).fill(false);
  S.lpos=Array.from({length:n},()=>({x:0,y:0}));
  const g=S.gen;
  for(let i=0;i<n;i++){const cv=document.getElementById(`cv${i}`);if(cv)initCV(cv,i,g);}
}

function initCV(cv,i,g){
  const ctx=cv.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
  let cur=null,t0=0;
  const pt=e=>{const r=cv.getBoundingClientRect(),s=e.touches?e.touches[0]:e;return{x:(s.clientX-r.left)*(cv.width/r.width),y:(s.clientY-r.top)*(cv.height/r.height)};};
  const sd=e=>{e.preventDefault();if(g!==S.gen)return;S.drawing[i]=true;t0=Date.now();cur={xs:[],ys:[],ts:[]};const p=pt(e);S.lpos[i]=p;cur.xs.push(p.x);cur.ys.push(p.y);cur.ts.push(0);ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(p.x,p.y,1.5,0,Math.PI*2);ctx.fill();cv.classList.add('on');};
  const md=e=>{if(!S.drawing[i]||!cur||g!==S.gen)return;e.preventDefault();const p=pt(e);ctx.strokeStyle='#1a1a1a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(S.lpos[i].x,S.lpos[i].y);ctx.lineTo(p.x,p.y);ctx.stroke();S.lpos[i]=p;cur.xs.push(p.x);cur.ys.push(p.y);cur.ts.push(Date.now()-t0);};
  const eu=()=>{if(!S.drawing[i])return;S.drawing[i]=false;if(cur&&cur.xs.length>1)S.strokes[i].push(cur);cur=null;clearTimeout(S.timers[i]);S.timers[i]=setTimeout(()=>recog(i,cv.width,cv.height,g),800);};
  cv.addEventListener('mousedown',sd);cv.addEventListener('mousemove',md);cv.addEventListener('mouseup',eu);cv.addEventListener('mouseleave',eu);
  cv.addEventListener('touchstart',sd,{passive:false});cv.addEventListener('touchmove',md,{passive:false});cv.addEventListener('touchend',eu);
}

async function recog(i,w,h,g){
  if(g!==S.gen||!S.strokes[i]||!S.strokes[i].length)return;
  const el=document.getElementById(`cds${i}`);if(!el)return;
  el.innerHTML='<span class="rg">認識中...</span>';
  try{
    const ink=S.strokes[i].map(s=>[s.xs,s.ys,s.ts]);
    const res=await fetch('https://inputtools.google.com/request?ime=handwriting&app=translate&dbg=1&cs=1&oe=UTF-8',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({options:'enable_pre_space',requests:[{writing_guide:{writing_area_width:w,writing_area_height:h},ink,language:'ja'}]})});
    if(g!==S.gen)return;
    const data=await res.json();
    const cands=(data[1]?.[0]?.[1]||[]).slice(0,8).filter(c=>c.trim());
    if(g===S.gen)showCands(i,cands);
  }catch(err){if(g===S.gen&&el)el.innerHTML='';}
}

function showCands(i,cands){
  S.candData[i]=cands;
  const el=document.getElementById(`cds${i}`);if(!el)return;
  el.innerHTML='';
  cands.forEach(ch=>{const b=document.createElement('button');b.className='cd'+(S.selChars[i]===ch?' sel':'');b.textContent=ch;b.onclick=()=>{S.selChars[i]=ch;showCands(i,S.candData[i]||[]);};el.appendChild(b);});
}

// ── Actions ─────────────────────────────────────────
window.clrCV=i=>{
  const cv=document.getElementById(`cv${i}`);if(!cv)return;
  cv.getContext('2d').clearRect(0,0,cv.width,cv.height);cv.classList.remove('on');
  S.strokes[i]=[];S.selChars[i]=null;S.candData[i]=[];clearTimeout(S.timers[i]);
  const el=document.getElementById(`cds${i}`);if(el)el.innerHTML='';
};

window.goHome=()=>{S.screen='home';render();};

let _lastGrpIdx=0,_lastGrpType='kaki';
window.stG=(gi,t)=>{
  const gs=grps(t),qs=gs[gi];if(!qs||!qs.length)return;
  _lastGrpIdx=gi;_lastGrpType=t;
  S.qs=qs.slice().sort(()=>Math.random()-.5);
  S.label=(t==='kaki'?'書き取り':'読み取り')+' '+(gi+1);
  S.idx=0;S.score=0;S.missed=[];S.rev=false;S.isRetry=false;S.lastRes=null;S.screen='quiz';render();
};

window.stR=sec=>{
  const ms=S.allMissed.filter(q=>q.sec===sec);if(!ms.length)return;
  S.qs=ms.slice().sort(()=>Math.random()-.5);
  S.label=(sec==='kaki'?'書き取り':'読み取り')+'（復習）';
  S.idx=0;S.score=0;S.missed=[];S.rev=false;S.isRetry=true;S.lastRes=null;S.screen='quiz';render();
};

window.stG_again=()=>stG(_lastGrpIdx,_lastGrpType);

window.doCheck=()=>{
  if(S.rev)return;
  const q=S.qs[S.idx];
  const allSel=S.selChars.length>0&&S.selChars.every(c=>c!==null);
  let ok=false,auto=false;
  if(allSel){auto=true;ok=q.sec==='kaki'?S.selChars.every((c,i)=>c===q.ans[i]):S.selChars.join('')===q.read;}
  else ok=true;
  if(ok){S.score++;const i2=S.allMissed.findIndex(m=>m.ans===q.ans&&m.sec===q.sec);if(i2!==-1)S.allMissed.splice(i2,1);}
  else{S.missed.push(q);if(!S.allMissed.find(m=>m.ans===q.ans&&m.sec===q.sec))S.allMissed.push(q);}
  S.lastRes={ok,auto,skip:false};S.rev=true;render();
};

window.doSkip=()=>{
  if(S.rev)return;
  const q=S.qs[S.idx];
  S.missed.push(q);if(!S.allMissed.find(m=>m.ans===q.ans&&m.sec===q.sec))S.allMissed.push(q);
  S.lastRes={ok:false,auto:false,skip:true};S.rev=true;render();
};

window.doNext=()=>{
  S.idx++;S.rev=false;S.lastRes=null;
  S.screen=S.idx>=S.qs.length?'score':'quiz';
  render();
};

window.doRetryMissed=()=>{
  const ms=S.missed.slice();
  S.qs=ms.sort(()=>Math.random()-.5);
  S.label=S.label+'（再挑戦）';
  S.idx=0;S.score=0;S.missed=[];S.rev=false;S.isRetry=true;S.lastRes=null;S.screen='quiz';render();
};

render();
</script>
