<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字練習アプリ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:#f5f4f0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:1rem;}
.app{width:100%;max-width:640px;padding:1rem 0;}
.header-bar{display:flex;align-items:center;gap:12px;margin-bottom:1.2rem;}
.header-bar h1{font-size:18px;font-weight:700;color:#1a1a1a;white-space:nowrap;}
.prog-wrap{flex:1;background:#e0dfd9;border-radius:99px;height:6px;overflow:hidden;}
.prog-bar{background:#534AB7;height:6px;border-radius:99px;transition:width 0.3s;}
.counter{font-size:13px;color:#666;white-space:nowrap;}
.tab-row{display:flex;gap:6px;margin-bottom:.8rem;border-bottom:1px solid #ddd;padding-bottom:.6rem;}
.tab-btn{font-size:13px;padding:5px 14px;border-radius:99px;border:1px solid #ccc;background:#fff;color:#666;cursor:pointer;font-family:inherit;}
.tab-btn.on{background:#534AB7;color:#fff;border-color:#534AB7;}
.set-select{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.8rem;}
.set-btn{font-size:11px;padding:4px 9px;border-radius:99px;border:1px solid #ccc;background:#fff;color:#666;cursor:pointer;font-family:inherit;}
.set-btn.on{background:#534AB7;color:#fff;border-color:#534AB7;}
.q-card{background:#fff;border:1px solid #e0dfd9;border-radius:16px;padding:1.25rem 1.5rem 1rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.sentence{font-size:20px;line-height:1.9;color:#1a1a1a;}
.kana{font-size:20px;font-weight:700;color:#534AB7;border-bottom:2px solid #534AB7;}
.sub-hint{font-size:12px;color:#999;margin-top:4px;}
.canvas-row{display:flex;gap:10px;justify-content:center;margin:1rem 0;flex-wrap:wrap;}
.cbox{display:flex;flex-direction:column;align-items:center;gap:4px;}
.clabel{font-size:11px;color:#aaa;}
canvas{border:1.5px dashed #bbb;border-radius:10px;background:#f9f8f5;cursor:crosshair;touch-action:none;display:block;}
canvas.active{border:1.5px solid #534AB7;}
.clr-btn{font-size:11px;color:#999;background:none;border:none;cursor:pointer;padding:2px 8px;font-family:inherit;}
.actions{display:flex;gap:8px;justify-content:center;margin-top:.5rem;flex-wrap:wrap;}
button{font-family:inherit;font-size:14px;padding:9px 20px;border-radius:10px;cursor:pointer;border:1px solid #ccc;background:#fff;color:#1a1a1a;transition:all .15s;}
button:hover{background:#f0eff9;}
.bp{background:#534AB7!important;color:#fff!important;border-color:#534AB7!important;}
.bp:hover{background:#3C3489!important;}
.br{background:#D85A30!important;color:#fff!important;border-color:#D85A30!important;}
.br:hover{background:#993C1D!important;}
.result-msg{text-align:center;font-size:15px;font-weight:500;padding:.4rem;min-height:26px;}
.ok{color:#1D9E75;}.ng{color:#E24B4A;}
.ans-box{width:110px;height:110px;border:1px solid #e0dfd9;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:46px;color:#1a1a1a;position:relative;}
.ans-lbl{position:absolute;top:5px;left:7px;font-size:10px;color:#aaa;}
.reading{display:inline-block;background:#f0eff9;border:1px solid #c9c6f0;border-radius:10px;font-size:12px;color:#534AB7;padding:2px 12px;margin-top:2px;}
.score-card{background:#fff;border:1px solid #e0dfd9;border-radius:16px;padding:2rem;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.score-num{font-size:52px;font-weight:700;color:#534AB7;}
.score-sub{font-size:14px;color:#666;margin-top:4px;}
.missed-section{margin-top:1.5rem;text-align:left;}
.missed-section h3{font-size:13px;font-weight:500;color:#666;margin-bottom:8px;}
.missed-item{font-size:13px;padding:5px 0;border-bottom:1px solid #f0eff0;display:flex;justify-content:space-between;gap:8px;}
.missed-ans{font-weight:500;color:#534AB7;white-space:nowrap;}
.retry-banner{background:#fff5f2;border:1px solid #f0997b;border-radius:12px;padding:10px 14px;margin-bottom:.8rem;display:flex;align-items:center;gap:8px;}
.retry-banner span{font-size:13px;color:#D85A30;flex:1;}
.retry-badge{display:inline-block;background:#fff5f2;border:1px solid #f0997b;border-radius:99px;font-size:11px;color:#D85A30;padding:2px 10px;margin-left:6px;vertical-align:middle;}
.mode-row{display:flex;gap:6px;margin-bottom:.8rem;}
.mode-btn{font-size:12px;padding:4px 12px;border-radius:99px;border:1px solid #ccc;background:#fff;color:#666;cursor:pointer;font-family:inherit;}
.mode-btn.on{background:#1D9E75;color:#fff;border-color:#1D9E75;}
.label-sm{font-size:13px;color:#666;}
.slider-row{display:flex;gap:8px;align-items:center;margin-bottom:1rem;}
input[type=range]{flex:1;accent-color:#534AB7;}
.score-actions{margin-top:1.5rem;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.canvas-row{align-items:flex-start;}
.candidates-wrap{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:4px 0;min-height:20px;max-width:200px;}
.cand-btn{font-size:19px;padding:4px 8px;border-radius:8px;border:1.5px solid #ccc;background:#fff;cursor:pointer;font-family:inherit;color:#1a1a1a;min-width:38px;min-height:38px;line-height:1;}
.cand-btn.sel{background:#534AB7;color:#fff;border-color:#534AB7;}
.recognizing{font-size:11px;color:#aaa;padding:4px;}
</style>
</head>
<body>
<div class="app">
  <div id="start-view">
    <div class="tab-row">
      <button class="tab-btn on" id="tab-kaki" onclick="switchSection('kaki')">書き取り（①〜⑨）</button>
      <button class="tab-btn" id="tab-yomi" onclick="switchSection('yomi')">読み取り（①〜⑩）</button>
    </div>
    <div id="retry-banner" style="display:none" class="retry-banner">
      <span id="retry-count-label"></span>
      <button class="br" style="padding:6px 14px;font-size:13px" onclick="startRetry()">再練習する</button>
    </div>
    <div style="margin-bottom:.6rem">
      <div class="label-sm" style="font-weight:500;margin-bottom:.4rem">セット選択</div>
      <div class="set-select" id="set-select"></div>
    </div>
    <div class="mode-row">
      <button class="mode-btn on" id="mode-rand" onclick="setMode('rand')">ランダム</button>
      <button class="mode-btn" id="mode-seq" onclick="setMode('seq')">順番通り</button>
    </div>
    <div class="slider-row">
      <label class="label-sm">出題数</label>
      <input type="range" min="5" max="50" value="25" id="count-slider" oninput="document.getElementById('count-val').textContent=this.value">
      <span id="count-val" style="font-size:13px;font-weight:500;min-width:24px">25</span>問
    </div>
    <button class="bp" onclick="startQuiz()" style="width:100%;padding:11px;font-size:15px">練習開始</button>
  </div>

  <div id="quiz-view" style="display:none">
    <div class="header-bar">
      <h1 id="q-title">書き取り<span id="retry-label"></span></h1>
      <div class="prog-wrap"><div class="prog-bar" id="prog"></div></div>
      <span class="counter" id="counter">1 / 25</span>
    </div>
    <div class="q-card">
      <div class="sentence" id="sentence"></div>
      <div class="sub-hint" id="sub-hint"></div>
    </div>
    <div class="canvas-row" id="canvas-row"></div>
    <div class="actions" id="actions"></div>
    <div class="result-msg" id="result-msg"></div>
  </div>

  <div id="score-view" style="display:none">
    <div class="score-card">
      <div class="score-num" id="final-score"></div>
      <div class="score-sub" id="final-sub"></div>
      <div class="missed-section" id="missed-section"></div>
      <div class="score-actions" id="score-actions"></div>
    </div>
  </div>
</div>

<script>

function setupCanvas(cv,i){

async function doRecognize(i,w,h){

  let correct=false,auto=false;
  if(skip){missed.push(q);if(!allMissed.find(m=>m.ans===q.ans&&m.sec===q.sec))allMissed.push(q);}
  else if(allSel){
    auto=true;
    correct=q.sec==='kaki'?selectedChars.every((c,i)=>c===q.ans[i]):selectedChars.join('')===q.read;
    if(correct){score++;const i2=allMissed.findIndex(m=>m.ans===q.ans&&m.sec===q.sec);if(i2!==-1)allMissed.splice(i2,1);}
    else{missed.push(q);if(!allMissed.find(m=>m.ans===q.ans&&m.sec===q.sec))allMissed.push(q);}
  }else{correct=true;score++;const i2=allMissed.findIndex(m=>m.ans===q.ans&&m.sec===q.sec);if(i2!==-1)allMissed.splice(i2,1);}
  const row=document.getElementById('canvas-row');row.innerHTML='';
  const bsz=q.ans.length<=3?110:85,bfs=q.ans.length<=3?46:34;
  for(let i=0;i<q.ans.length;i++){
    const box=document.createElement('div');box.className='ans-box';box.style.width=box.style.height=bsz+'px';box.style.fontSize=bfs+'px';
    if(auto&&q.sec==='kaki'){const ok=selectedChars[i]===q.ans[i];box.style.borderColor=ok?'#1D9E75':'#E24B4A';const mk=document.createElement('span');mk.style.cssText='position:absolute;bottom:4px;right:6px;font-size:13px;font-weight:700;color:'+(ok?'#1D9E75':'#E24B4A');mk.textContent=ok?'○':'✗';box.appendChild(mk);}
    const lbl=document.createElement('div');lbl.className='ans-lbl';lbl.textContent=(i+1)+'文字目';
    box.append(lbl,document.createTextNode(q.ans[i]));row.appendChild(box);
  }
  const rb=document.createElement('div');rb.className='reading';rb.textContent='読み：'+q.read;row.appendChild(rb);
  const msg=document.getElementById('result-msg');
  if(skip){msg.textContent='答え：'+q.ans+'（'+q.read+'）';msg.className='result-msg ng';}
  else if(auto){msg.textContent=correct?'正解！ '+q.ans+'（'+q.read+'）':'不正解 → 正解：'+q.ans+'（'+q.read+'）';msg.className='result-msg '+(correct?'ok':'ng');}
  else{msg.textContent='正解：'+q.ans+'（'+q.read+'）';msg.className='result-msg ok';}
  const act=document.getElementById('actions');act.innerHTML='';
  const nx=document.createElement('button');nx.className='bp';nx.textContent=idx+1<order.length?'次の問題 →':'結果を見る';nx.onclick=()=>next();act.appendChild(nx);
}
function next(){idx++;if(idx>=order.length){document.getElementById('quiz-view').style.display='none';document.getElementById('score-view').style.display='';const pct=Math.round(score/order.length*100);document.getElementById('final-score').textContent=score+' / '+order.length;document.getElementById('final-sub').textContent='正解率 '+pct+'% — '+(pct>=80?'素晴らしい！':pct>=60?'よくできました！':'もう一度挑戦しよう！');const ms=document.getElementById('missed-section');ms.innerHTML='';if(missed.length>0){ms.innerHTML='<h3>間違えた問題（'+missed.length+'問）</h3>';missed.forEach(q=>{const d=document.createElement('div');d.className='missed-item';d.innerHTML='<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">'+q.kana+'</span><span class="missed-ans">'+q.ans+'（'+q.read+'）</span>';ms.appendChild(d);});}const sa=document.getElementById('score-actions');sa.innerHTML='';if(missed.length>0){const rb=document.createElement('button');rb.className='br';rb.textContent='間違えた '+missed.length+' 問を再練習する';rb.onclick=()=>{order=missed.slice().sort(()=>Math.random()-.5);isRetry=true;idx=0;score=0;missed=[];document.getElementById('score-view').style.display='none';document.getElementById('quiz-view').style.display='';render();};sa.appendChild(rb);}const ag=document.createElement('button');ag.className='bp';ag.textContent='もう一度';ag.onclick=startQuiz;sa.appendChild(ag);const bk=document.createElement('button');bk.textContent='セット選択に戻る';bk.onclick=goStart;sa.appendChild(bk);}else{render();}}

buildSetButtons();
</script>
</body>
